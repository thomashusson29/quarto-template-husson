name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "_extensions/husson/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync extension assets and ensure .nojekyll exists in docs
        run: |
          touch docs/.nojekyll
          mkdir -p docs/_extensions/husson
          cp -R _extensions/husson/* docs/_extensions/husson/
          for f in auto-dark-renderings.js auto-dark-system.js auto-dark-reveal-init.js auto-dark-reveal.js navigation-reveal.js navigation-reveal.css; do
            if [ -f "_extensions/husson/$f" ]; then
              cp "_extensions/husson/$f" "docs/$f"
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
