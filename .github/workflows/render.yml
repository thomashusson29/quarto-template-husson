name: Render formats

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: 1.8.26
          tinytex: true

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies for reticulate example
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy pandas statsmodels matplotlib seaborn pillow plotly

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          packages: |
            any::dplyr
            any::ggplot2
            any::knitr
            any::magick
            any::plotly
            any::reticulate
            any::rmarkdown

      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils

      - name: Render the neutral template with the project command
        run: quarto render template.qmd

      - name: Render the Word format with the embedded reference document
        run: quarto render template.qmd --to husson-docx --output template.docx

      - name: Render the RevealJS format with Auto Dark Clean
        run: quarto render template.qmd --to husson-revealjs --output template-slides.html

      - name: Render the R/Python example
        run: quarto render examples/r-python-reticulate.qmd

      - name: Render the Reveal heading-colors example
        run: quarto render examples/exemple-revealjs.qmd --to husson-revealjs --output exemple-revealjs.html

      - name: Check generated artifacts
        shell: bash
        run: |
          test -s output/template.html
          test -s output/template.pdf
          test -s output/template.docx
          test -s output/template-slides.html
          test -s output/examples/r-python-reticulate.html
          test -s output/examples/exemple-revealjs.html
          grep -q "husson-heading-colored" output/examples/exemple-revealjs.html
          grep -q -- "--husson-heading-light:#107895" output/examples/exemple-revealjs.html
          test -s output/auto-dark-reveal-init.js
          test -s output/auto-dark-reveal.js
          grep -q "Predicted" output/examples/r-python-reticulate.html
          grep -q "#7b8794" output/examples/r-python-reticulate.html
          grep -q "hookPlotlyGlobal" output/auto-dark-renderings.js
          grep -q "#9aa5b1" output/auto-dark-renderings.js
          grep -q "#5c6370" output/auto-dark-renderings.js
          grep -q "auto-dark-system.js" output/template.html
          grep -q "auto-dark-renderings.js" output/template.html
          grep -q "auto-dark-reveal-init.js" output/template-slides.html
          grep -q "auto-dark-reveal.js" output/template-slides.html
          unzip -t output/template.docx
          pdfinfo output/template.pdf | grep -q '^Pages:'
