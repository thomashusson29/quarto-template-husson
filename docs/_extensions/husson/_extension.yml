title: Husson
author: Thomas Husson
version: 1.5.0
quarto-required: ">=1.8.0"

contributes:
  formats:
    html:
      toc: true
      toc-depth: 2
      df-print: kable
      theme:
        light: cosmo
        dark: darkly
      respect-user-color-scheme: true
      language:
        fr:
          crossref-tbl-title: "Tableau"
          crossref-tbl-prefix: "Tableau"
          crossref-lot-title: "Liste des tableaux"
      filters:
        - typography.lua
        - frontmatter.lua
        - heading-colors.lua
        - table-column-widths.lua
        - auto-dark.lua
      css:
        - auto-dark.css
        - auto-dark-os-detect.css
        - auto-dark-plot-filter.css
      r-options:
        ggplot2.discrete.colour:
          - "#61afef"
          - "#98c379"
          - "#e06c75"
          - "#c678dd"
          - "#d19a66"
          - "#56b6c2"
          - "#e5c07b"
        ggplot2.discrete.fill:
          - "#61afef"
          - "#98c379"
          - "#e06c75"
          - "#c678dd"
          - "#d19a66"
          - "#56b6c2"
          - "#e5c07b"
      knitr:
        opts_chunk:
          fig.bg: "transparent"
          dev.args:
            bg: "transparent"

    pdf:
      toc: true
      toc-depth: 2
      toc-title: "Table des matières"
      df-print: kable
      pdf-engine: xelatex
      pdf-engine-opts:
        - -interaction=nonstopmode
        - -halt-on-error
      cite-method: citeproc
      biblio-style: unsrturl
      natbiboptions: "numbers,round,sort,compress"
      number-sections: true
      documentclass: scrartcl
      papersize: a4
      fontsize: 10pt
      geometry: margin=2cm
      colorlinks: true
      linkcolor: NavyBlue
      urlcolor: NavyBlue
      language:
        fr:
          crossref-tbl-title: "Tableau"
          crossref-tbl-prefix: "Tableau"
          crossref-lot-title: "Liste des tableaux"
      filters:
        - frontmatter.lua
        - heading-levels.lua
        - navigation-header.lua
        - code-language.lua
        - typography.lua
        - table-column-widths.lua
      include-in-header:
        - pdf-header.tex
        - navigation-header.tex
      template-partials:
        - before-body.tex

    docx:
      toc: true
      toc-depth: 2
      df-print: kable
      number-sections: true
      language:
        fr:
          crossref-tbl-title: "Tableau"
          crossref-tbl-prefix: "Tableau"
          crossref-lot-title: "Liste des tableaux"
      filters:
        - typography.lua
        - frontmatter.lua
        - table-column-widths.lua
      reference-doc: template.docx

    revealjs:
      df-print: kable
      theme:
        - default
        - auto-dark-clean.scss
      menu:
        side: left
      slide-number: true
      transition: none
      background-transition: none
      date-format: long
      tbl-colwidths: false
      html-math-method: katex
      language:
        fr:
          crossref-tbl-title: "Tableau"
          crossref-tbl-prefix: "Tableau"
          crossref-lot-title: "Liste des tableaux"
      filters:
        - typography.lua
        - frontmatter.lua
        - heading-colors.lua
        - navigation-header.lua
        - table-column-widths.lua
        - auto-dark.lua
      css:
        - auto-dark.css
        - auto-dark-reveal.css
        - auto-dark-plot-filter.css
        - auto-dark-gt-reveal.css
        - auto-dark-switch.css
        - navigation-reveal.css
      r-options:
        ggplot2.discrete.colour:
          - "#61afef"
          - "#98c379"
          - "#e06c75"
          - "#c678dd"
          - "#d19a66"
          - "#56b6c2"
          - "#e5c07b"
        ggplot2.discrete.fill:
          - "#61afef"
          - "#98c379"
          - "#e06c75"
          - "#c678dd"
          - "#d19a66"
          - "#56b6c2"
          - "#e5c07b"
      knitr:
        opts_chunk:
          fig.bg: "transparent"
          dev.args:
            bg: "transparent"
