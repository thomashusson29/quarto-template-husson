title: Husson
author: Thomas Husson
version: 1.3.0
quarto-required: ">=1.8.0"

contributes:
  formats:
    html:
      toc: true
      toc-depth: 2
      theme:
        light: cosmo
        dark: darkly
      respect-user-color-scheme: true
      language:
        fr:
          crossref-tbl-title: "Tableau"
          crossref-tbl-prefix: "Tableau"
          crossref-lot-title: "Liste des tableaux"
      css:
        - auto-dark.css
        - auto-dark-os-detect.css
        - auto-dark-plot-filter.css
      include-in-header:
        - text: |
            <script src="auto-dark-system.js"></script>
      include-after-body:
        - text: |
            <script src="auto-dark-renderings.js"></script>
      format-resources:
        - auto-dark-system.js
        - auto-dark-renderings.js

    pdf:
      toc: true
      toc-depth: 2
      toc-title: "Table des matières"
      pdf-engine: xelatex
      pdf-engine-opts:
        - -interaction=nonstopmode
        - -halt-on-error
      cite-method: natbib
      biblio-style: unsrturl
      natbiboptions: "numbers,round,sort,compress"
      number-sections: true
      documentclass: scrartcl
      papersize: a4
      fontsize: 10pt
      geometry: margin=2cm
      colorlinks: true
      linkcolor: NavyBlue
      urlcolor: NavyBlue
      language:
        fr:
          crossref-tbl-title: "Tableau"
          crossref-tbl-prefix: "Tableau"
          crossref-lot-title: "Liste des tableaux"
      filters:
        - heading-levels.lua
        - navigation-header.lua
        - code-language.lua
        - typography.lua
        - table-column-widths.lua
      include-in-header:
        - pdf-header.tex
        - navigation-header.tex
      template-partials:
        - before-body.tex
      format-resources:
        - navigation-header.tex
        - logo-universite-paris-cite.png
        - logo-universite-paris-saclay.png
        - biblio_shared.bib
        - fonts/Carlito-Regular.ttf
        - fonts/Carlito-Bold.ttf
        - fonts/Carlito-Italic.ttf
        - fonts/Carlito-BoldItalic.ttf

    docx:
      toc: true
      toc-depth: 2
      number-sections: true
      language:
        fr:
          crossref-tbl-title: "Tableau"
          crossref-tbl-prefix: "Tableau"
          crossref-lot-title: "Liste des tableaux"
      reference-doc: template.docx

    revealjs:
      theme:
        - default
        - auto-dark-clean.scss
      menu:
        side: left
      slide-number: true
      transition: none
      background-transition: none
      date-format: long
      tbl-colwidths: false
      html-math-method: katex
      css:
        - auto-dark.css
        - auto-dark-reveal.css
        - auto-dark-plot-filter.css
        - auto-dark-gt-reveal.css
        - auto-dark-switch.css
      include-in-header:
        - text: |
            <script src="auto-dark-reveal-init.js"></script>
      include-after-body:
        - text: |
            <script src="auto-dark-reveal.js"></script>
        - text: |
            <script src="auto-dark-renderings.js"></script>
      format-resources:
        - auto-dark-reveal-init.js
        - auto-dark-reveal.js
        - auto-dark-renderings.js
